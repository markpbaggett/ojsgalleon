[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ojsgalleon"
version = "0.2.0"
description = "Convert DOCX and PDF files to structured HTML or JATS XML for Open Journal Systems (OJS)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["ojs", "jats", "pdf", "docx", "html", "academic", "journal", "publishing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Text Processing :: Markup :: XML",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "fastapi>=0.115.0",
    "mammoth>=1.8.0",
    "pdfplumber>=0.11.0",
    "pypandoc>=1.13",
    "pymupdf>=1.24.0",
    "python-multipart>=0.0.12",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
ojsgalleon = "ojsgalleon.cli:main"

[project.urls]
Repository = "https://github.com/tamu-dc-labs/ojsgalleon"
"Bug Tracker" = "https://github.com/tamu-dc-labs/ojsgalleon/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ojsgalleon"]

[tool.hatch.build.targets.sdist]
exclude = [
    "fixtures/",
    "uv.lock",
    ".idea/",
    "paper.html",
    "paper.xml",
]

[tool.uv]
dev-dependencies = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
